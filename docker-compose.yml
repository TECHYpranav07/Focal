version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    volumes:
      - backend-uploads:/app/uploads
    environment:
      - PORT=7860
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=sqlite+aiosqlite:////app/uploads/focal.db
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - SECRET_KEY=local-dev-insecure-secret-key-focal-123
      - DEBUG=true

  web:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:7860
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  backend-uploads:
